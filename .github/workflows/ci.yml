name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lua ${{ matrix.lua }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        lua: [luajit, lua5.1, lua5.4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua5.1 lua5.4

      - name: Check syntax
        run: luac -p init.lua main.lua src/*.lua tests/run.lua

      - name: Run tests
        run: ${{ matrix.lua }} tests/run.lua
